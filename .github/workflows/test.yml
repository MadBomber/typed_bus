name: Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The committed lock tracks current releases, some of which need
      # Ruby >= 3.3. Ruby 3.2 (the gemspec minimum) resolves its own set.
      - name: Resolve dependencies fresh on Ruby 3.2
        if: matrix.ruby == '3.2'
        run: rm Gemfile.lock

      # The optional :extras group (ratatui_ruby, aigcm) is not installed.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rake test

  # Loads the gem in a bundle holding only its declared runtime dependencies,
  # so an undeclared one (such as a bundled gem like logger) fails here.
  load-smoke:
    name: Gem loads outside the dev bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Bundle only the gem and its runtime dependencies
        working-directory: ${{ runner.temp }}
        run: |
          printf 'source "https://rubygems.org"\ngem "typed_bus", path: "%s"\n' "$GITHUB_WORKSPACE" > Gemfile
          bundle install

      - name: Require the gem under Bundler
        working-directory: ${{ runner.temp }}
        run: bundle exec ruby -e 'require "typed_bus"; puts TypedBus::VERSION'
